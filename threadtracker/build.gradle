apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

android {
    compileSdk 34
    resourcePrefix "${project.name}_"
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 34
        versionCode 10
        versionName "1.1.0"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false // 不能混淆
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug.initWith(buildTypes.release)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.codoon.threadthracker'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.startup:startup-runtime:1.0.0-alpha02'
}

afterEvaluate {
    publishing {
        publications {
            PluginPub(MavenPublication) {
                groupId = 'com.codoon.threadtracker'
                artifactId = 'threadtracker'
                version = "$threadtracker"

                artifact bundleReleaseAar
                //artifact sourcesJar
                //artifact packageJavadoc

                pom.withXml {
                    def dependenciesNode = asNode().appendNode("dependencies")
                    configurations.implementation.allDependencies.forEach() {
                        Dependency dependency ->
                            if (dependency.version != "unspecified" && dependency.name != "unspecified") {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', dependency.group)
                                dependencyNode.appendNode('artifactId', dependency.name)
                                dependencyNode.appendNode('version', dependency.version)
                            } else {
                                println(">>> [WARN] Excluded module: " + dependency.group + ":" + dependency.name)
                            }
                    }
                }
            }
        }

        repositories {
            maven {
                setUrl('../repositories')
            }
        }
    }
}
